# ============================================================
#  Профиль dev — запуск без PostgreSQL, на встроенной БД H2.
#  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  Консоль H2: http://localhost:8080/h2-console
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  seed:
    enabled: true
    demo-data: true

logging:
  level:
    ru.school.helpdesk: DEBUG
    org.hibernate.SQL: DEBUG


