# ============================================================
#  School HelpDesk — основные настройки
#  Значения можно переопределить переменными окружения.
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  # корректный IP/порт за reverse-proxy (nginx, HTTPS на 443)
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: school-helpdesk
  # По умолчанию приложение работает с PostgreSQL (настройки ниже).
  # Для быстрого запуска без СУБД: --spring.profiles.active=dev  (встроенная H2)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: helpdesk-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      # update — схема создаётся/обновляется автоматически.
      # Для строгого контроля миграций можно подключить Flyway.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ------------------------------------------------------------
#  Настройки приложения
# ------------------------------------------------------------
app:
  jwt:
    # ВАЖНО: в production обязательно задайте APP_JWT_SECRET (мин. 32 символа)
    secret: ${APP_JWT_SECRET:change-me-school-helpdesk-default-development-secret-key-32+}
    expiration: ${APP_JWT_EXPIRATION:12h}
    issuer: school-helpdesk
  cors:
    # источники для dev-сервера Vite; в production frontend раздаёт сам backend
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed:
    # создание администратора и справочника категорий при первом старте
    enabled: ${APP_SEED_ENABLED:true}
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}
    admin-full-name: Администратор системы
    # демо-пользователи и заявки (полезно для знакомства с системой)
    demo-data: ${APP_SEED_DEMO:false}

# Swagger UI отключён в production, включается в профиле dev
# или переменной SPRINGDOC_ENABLED=true (доступ только для ADMIN)
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    ru.school.helpdesk: INFO
    org.hibernate.SQL: WARN


