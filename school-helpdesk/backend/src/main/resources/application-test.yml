# Профиль для автотестов (H2 in-memory)
spring:
  datasource:
    url: jdbc:h2:mem:helpdesk-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-school-helpdesk-unit-tests-0123456789
  seed:
    enabled: true
    demo-data: false

logging:
  level:
    root: WARN
    ru.school.helpdesk: INFO


