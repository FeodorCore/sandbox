# ============================================================
#  School HelpDesk — инфраструктура
#  Поднимает PostgreSQL для backend-а.
#
#  Запуск:   docker compose up -d
#  Остановка: docker compose down
#  Данные БД сохраняются в томе pgdata.
#
#  Порт 5432 опубликован только на 127.0.0.1 — из внешней сети
#  база недоступна, к ней подключается лишь backend на этом же сервере.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-helpdesk}
      POSTGRES_USER: ${DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
      # локаль не критична, но фиксируем TZ для совпадения с backend
      TZ: Europe/Moscow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-helpdesk} -d ${DB_NAME:-helpdesk}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # скромные лимиты — школьному серверу хватает
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
